Global:
  use_gpu: false
  epoch_num: 1
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./tools/finetune/output/rec_arabic_ft_cpu_probe/
  save_epoch_step: 5
  eval_batch_step:
  - 0
  - 500
  cal_metric_during_train: true
  pretrained_model: ./tools/finetune/pretrain_models/arabic_PP-OCRv4_rec_train/best_accuracy
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: ./tools/finetune/PaddleOCR_source/ppocr/utils/dict/arabic_dict.txt
  max_text_length: 40
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./tools/finetune/output/rec_arabic_ft/predicts.txt
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride:
    - 1
    - 2
    last_pool_type: avg
    last_pool_kernel_size:
    - 2
    - 4
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 64
    depth: 2
    hidden_dims: 120
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 1.0e-05
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
  is_filter: false
Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/train/
    label_file_list:
    - ./tools/finetune/data/finetune/train/labels.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - RecAug: null
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/val/
    label_file_list:
    - ./tools/finetune/data/finetune/val/labels.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  loader:
    shuffle: false
    batch_size_per_card: 32
    drop_last: false
    num_workers: 4
profiler_options: null
