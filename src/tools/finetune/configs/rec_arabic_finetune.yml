# PaddleOCR PP-OCRv4 Arabic Recognition — Fine-tuning config
# Base architecture: SVTR_LCNet (same as the shipped arabic PP-OCRv4 model)
#
# Run from repo root:
#   python tools/finetune/PaddleOCR_source/tools/train.py \
#          -c tools/finetune/configs/rec_arabic_finetune.yml
#
# Key differences from training-from-scratch:
#   - pretrained_model points to downloaded PP-OCRv4 Arabic weights
#   - learning_rate is 10× lower (0.0001 vs 0.001)
#   - warmup_epoch is shorter (2 vs 5)
#   - epoch_num is 50 (fine-tuning converges quickly)

Global:
  use_gpu:              true
  epoch_num:            50
  log_smooth_window:    20
  print_batch_step:     10
  save_model_dir:       ./tools/finetune/output/rec_arabic_ft/
  save_epoch_step:      5
  # Evaluate and save best every 500 iterations
  eval_batch_step:      [0, 500]
  cal_metric_during_train: true
  # ← Set this to the downloaded pretrained model directory
  pretrained_model:     ./tools/finetune/pretrain_models/arabic_PP-OCRv4_rec_train/best_accuracy
  checkpoints:          null
  save_inference_dir:   null
  use_visualdl:         false
  infer_img:            null
  # Arabic character dictionary shipped with PaddleOCR source
  character_dict_path:  ./tools/finetune/PaddleOCR_source/ppocr/utils/dict/arabic_dict.txt
  max_text_length:      40
  infer_mode:           false
  use_space_char:       true
  distributed:          false
  save_res_path:        ./tools/finetune/output/rec_arabic_ft/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    # Fine-tuning LR: 10× lower than from-scratch training
    learning_rate: 0.0001
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm:  SVTR_LCNet
  Transform:
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride: [1, 2]
    last_pool_type: avg
    last_pool_kernel_size: [2, 4]
  Neck:
    name: SequenceEncoder
    encoder_type: svtr
    dims: 64
    depth: 2
    hidden_dims: 120
    use_guide: true
  Head:
    name: CTCHead
    fc_decay: 0.00001

Loss:
  name: CTCLoss

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  # Words containing Arabic-only characters may be ignored in metric
  # calculation if not in dict; set is_filter to true if you see warnings.
  is_filter: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/train/
    label_file_list:
      - ./tools/finetune/data/finetune/train/labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecAug:
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle:            true
    batch_size_per_card: 64
    drop_last:          true
    num_workers:        4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/val/
    label_file_list:
      - ./tools/finetune/data/finetune/val/labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - CTCLabelEncode:
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label', 'length']
  loader:
    shuffle:            false
    batch_size_per_card: 64
    drop_last:          false
    num_workers:        4
