# PaddleOCR PP-OCRv4 Arabic Recognition — Fine-tuning config
#
# Architecture matches the shipped arabic_PP-OCRv4_rec_train model exactly:
#   MultiHead (CTCHead + NRTRHead) — same as PaddleOCR's official training config.
#   Using CTCHead-only would cause a shape mismatch and a 42TB warpctc allocation.
#
# Run from repo root:
#   python tools/finetune/PaddleOCR_source/tools/train.py \
#          -c tools/finetune/configs/rec_arabic_finetune.yml
#
# In Colab or any environment where cwd != repo root, patch paths to absolute
# before training (see Collab setup cell in the fine-tuning guide).

Global:
  use_gpu:                 true
  epoch_num:               50
  log_smooth_window:       20
  print_batch_step:        10
  save_model_dir:          ./tools/finetune/output/rec_arabic_ft/
  save_epoch_step:         5
  eval_batch_step:         [0, 500]
  cal_metric_during_train: true
  pretrained_model:        ./tools/finetune/pretrain_models/arabic_PP-OCRv4_rec_train/best_accuracy
  checkpoints:             null
  save_inference_dir:      null
  use_visualdl:            false
  infer_img:               null
  character_dict_path:     ./tools/finetune/PaddleOCR_source/ppocr/utils/dict/arabic_dict.txt
  max_text_length:         &max_text_length 40
  infer_mode:              false
  use_space_char:          true
  distributed:             false
  save_res_path:           ./tools/finetune/output/rec_arabic_ft/predicts.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch:  2
  regularizer:
    name:   L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm:  SVTR_LCNet
  Transform:
  Backbone:
    name: MobileNetV1Enhance
    scale: 0.5
    last_conv_stride:    [1, 2]
    last_pool_type:      avg
    last_pool_kernel_size: [2, 4]
  Neck:
    name:         SequenceEncoder
    encoder_type: svtr
    dims:         64
    depth:        2
    hidden_dims:  120
    use_guide:    true
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name:      svtr
            dims:      64
            depth:     2
            hidden_dims: 120
            use_guide: false
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          num_decoder_layers: 2
          num_head:           8
          max_text_length:    *max_text_length
          wh_ratio_list:      [2.0, 4.0]
          transformer_config:
            attention_dropout_rate:  0.0
            residual_dropout_rate:   0.1
            compress_attention_weights: false
            d_embedding:  256
            d_inner_hid:  1024
            d_k:          32
            d_v:          32
            d_model:      256
            d_word_vec:   256
            num_head:     8
            num_layer:    2
          beam_size: 10

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name:           RecMetric
  main_indicator: acc
  is_filter:      false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/train/
    label_file_list:
      - ./tools/finetune/data/finetune/train/labels.txt
    transforms:
      - DecodeImage:
          img_mode:      BGR
          channel_first: false
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label_ctc', 'label_gtc', 'length', 'valid_ratio']
  loader:
    shuffle:             true
    batch_size_per_card: 64
    drop_last:           true
    num_workers:         4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./tools/finetune/data/finetune/val/
    label_file_list:
      - ./tools/finetune/data/finetune/val/labels.txt
    transforms:
      - DecodeImage:
          img_mode:      BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys: ['image', 'label_ctc', 'label_gtc', 'length', 'valid_ratio']
  loader:
    shuffle:             false
    batch_size_per_card: 64
    drop_last:           false
    num_workers:         4
